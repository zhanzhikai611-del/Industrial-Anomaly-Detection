<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>CNC Cloud · 登录</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #f4f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #303133;
        }

        /* ── 登录卡片 ── */
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.08);
            width: 420px;
            padding: 40px 40px 36px;
        }

        /* ── 品牌区 ── */
        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .login-logo {
            width: 38px;
            height: 38px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #303133;
            letter-spacing: -0.2px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #909399;
            margin-bottom: 32px;
            padding-left: 50px;
        }

        /* ── 表单 ── */
        .fm-group {
            margin-bottom: 18px;
        }

        .fm-label {
            display: block;
            font-size: 13px;
            color: #606266;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .fm-wrap {
            position: relative;
        }

        .fm-input {
            width: 100%;
            height: 40px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            padding: 0 14px;
            font-size: 14px;
            color: #303133;
            outline: none;
            transition: border-color 0.15s;
            background: #fff;
        }

        .fm-input::placeholder {
            color: #c0c4cc;
        }

        .fm-input:focus {
            border-color: #409EFF;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, .12);
        }

        .fm-input.error {
            border-color: #f56c6c;
        }

        /* 密码可见切换图标 */
        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #c0c4cc;
            display: flex;
            align-items: center;
        }

        .pw-toggle:hover {
            color: #409EFF;
        }

        .pw-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── 错误提示 ── */
        .error-msg {
            background: #fef0f0;
            border: 1px solid #fde2e2;
            border-radius: 6px;
            padding: 10px 14px;
            color: #f56c6c;
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── 登录按钮 ── */
        .login-btn {
            width: 100%;
            height: 42px;
            background: #409EFF;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, box-shadow 0.15s;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: #337ecc;
        }

        .login-btn:active {
            background: #2b6cb0;
        }

        /* ── 页脚版本号 ── */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #c0c4cc;
        }
    </style>
</head>

<body>
    <div class="login-card">

        {% include 'monitor/includes/login/brand.html' %}

        {% include 'monitor/includes/login/form.html' %}

        <div class="login-footer">V2.2.1 · CNC智能预警系统 · Industrial Warning System</div>
    </div>

    {% include 'monitor/includes/login/logic.html' %}
</body>

</html>
