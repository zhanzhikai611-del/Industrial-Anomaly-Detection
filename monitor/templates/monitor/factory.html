<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Digital Twin | CNC Cloud</title>
    
    <!-- Core UI & 3D Deps -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/21.0.0/tween.umd.js"></script>
    
    <link rel="stylesheet" href="{% static 'monitor/css/factory.css' %}">
    <style>
        /* Base Variables - Same as base.html */
        :root {
            --sidebar-w: 200px;
            --navbar-h: 56px;
            --primary: #409EFF;
            --primary-bg: #ecf5ff;
            --text: #303133;
            --text-sec: #606266;
            --text-hint: #909399;
            --text-weak: #C0C4CC;
            --border: #e4e7ed;
            --font: -apple-system, 'Helvetica Neue', Arial, 'PingFang SC', sans-serif;
            --font-mono: 'Menlo', 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <!-- Standalone Header -->
    {% include 'monitor/includes/factory/header_standalone.html' %}

    <div class="main-wrapper">
        <!-- 3D Scene Area -->
        {% include 'monitor/includes/factory/scene_container.html' %}
        
        <!-- Right Rail Panel -->
        {% include 'monitor/includes/factory/right_rail_panel.html' %}
    </div>

    <!-- Factory App Engine -->
    <script src="{% static 'monitor/js/engines/factory.js' %}"></script>
</body>

</html>
