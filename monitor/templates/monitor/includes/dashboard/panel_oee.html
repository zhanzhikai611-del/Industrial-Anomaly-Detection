<div class="db-card" 
     hx-get="{% url 'dashboard_partial' 'oee' %}" 
     hx-trigger="every 5s" 
     hx-sync="this:replace"
     hx-swap="outerHTML">
    <div class="db-title"><span class="db-title-bar"></span>综合效能指标（OEE）
        <span id="oee-pct" class="mono"
            style="margin-left:auto;font-size:22px;font-weight:700;color:#409EFF;">{{ oee_pct|default:"--" }}</span>
    </div>
    <div style="font-size:11px;color:#909399;text-align:right;margin-top:-8px;margin-bottom:6px;">综合 OEE</div>
    <div class="slim-wrap" style="height:6px;margin-bottom:14px;">
        <div class="slim-fill" id="oee-bar" style="width:{{ oee_bar_width|default:0 }}%;background:#409EFF;"></div>
    </div>
    <!-- Q/P/A 三列次条 — 原生 CSS 渐变，自底部升起动效 -->
    <div
        style="display:flex;justify-content:space-around;align-items:stretch;height:155px;padding:0 6px;padding-top:4px;">
        <!-- Q -->
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
            <span id="oee-q-val"
                style="font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;color:#595959;margin-bottom:6px;">{{ oee_q_val|default:"--" }}</span>
            <div
                style="width:28px;flex:1;background:#f0f2f5;border-radius:3px 3px 0 0;position:relative;overflow:hidden;">
                <div id="oee-q-bar"
                    style="position:absolute;bottom:0;width:100%;height:{{ oee_q_bar|default:0 }}%;background:linear-gradient(180deg,#9254DE 0%,#D3ADF7 100%);border-radius:3px 3px 0 0;transition:height 0.9s cubic-bezier(.23,1,.32,1);">
                </div>
            </div>
            <span style="font-size:11px;color:#909399;margin-top:5px;">良率(Q)</span>
        </div>
        <!-- P -->
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
            <span id="oee-p-val"
                style="font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;color:#595959;margin-bottom:6px;">{{ oee_p_val|default:"--" }}</span>
            <div
                style="width:28px;flex:1;background:#f0f2f5;border-radius:3px 3px 0 0;position:relative;overflow:hidden;">
                <div id="oee-p-bar"
                    style="position:absolute;bottom:0;width:100%;height:{{ oee_p_bar|default:0 }}%;background:linear-gradient(180deg,#1890FF 0%,#91D5FF 100%);border-radius:3px 3px 0 0;transition:height 0.9s cubic-bezier(.23,1,.32,1);">
                </div>
            </div>
            <span style="font-size:11px;color:#909399;margin-top:5px;">性能(P)</span>
        </div>
        <!-- A -->
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
            <span id="oee-a-val"
                style="font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;color:#595959;margin-bottom:6px;">{{ oee_a_val|default:"--" }}</span>
            <div
                style="width:28px;flex:1;background:#f0f2f5;border-radius:3px 3px 0 0;position:relative;overflow:hidden;">
                <div id="oee-a-bar"
                    style="position:absolute;bottom:0;width:100%;height:{{ oee_a_bar|default:0 }}%;background:linear-gradient(180deg,#13C2C2 0%,#87E8DE 100%);border-radius:3px 3px 0 0;transition:height 0.9s cubic-bezier(.23,1,.32,1);">
                </div>
            </div>
            <span style="font-size:11px;color:#909399;margin-top:5px;">可用性(A)</span>
        </div>
    </div>
</div>
