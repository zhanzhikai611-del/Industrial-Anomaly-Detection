<style>
    /* ── Ask 模式 侧边轴屉 (Figma V2.2) ── */
    .ask-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: transparent;
        z-index: 1000;
        overflow: hidden;
    }

    .ask-modal {
        position: fixed;
        top: calc(var(--navbar-h) + 12px);
        bottom: 12px;
        right: 12px;
        width: 360px;
        background: rgba(17, 24, 39, 0.85);
        backdrop-filter: blur(60px);
        -webkit-backdrop-filter: blur(60px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: -15px 0 45px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 1001;
        transform: translateX(110%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ask-overlay.show .ask-modal {
        transform: translateX(0);
    }

    .ask-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 0, 0, 0.2);
    }

    .ask-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: transparent;
    }

    .msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
        position: relative;
    }

    .msg-user {
        align-self: flex-end;
        background: var(--primary);
        color: #fff;
        border-bottom-right-radius: 2px;
        box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
    }

    .msg-ai {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom-left-radius: 2px;
    }

    /* Markdown 渲染样式增强 (V2.1.1) */
    .msg-ai table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
        font-size: 13px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
    }

    .msg-ai th,
    .msg-ai td {
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
    }

    .msg-ai th {
        background: rgba(255, 255, 255, 0.05);
        color: var(--primary);
        font-weight: 600;
    }

    .msg-ai p {
        margin-bottom: 8px;
    }

    .msg-ai p:last-child {
        margin-bottom: 0;
    }

    .msg-ai h1,
    .msg-ai h2,
    .msg-ai h3 {
        margin: 12px 0 8px 0;
        color: #fff;
        font-size: 1.1em;
        font-weight: 700;
    }

    .msg-ai ul,
    .msg-ai ol {
        padding-left: 20px;
        margin-bottom: 8px;
    }

    .msg-ai code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.9em;
    }

    .ask-input-area {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.2);
    }

    .ask-input {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 10px 16px;
        outline: none;
        transition: all 0.2s;
        font-size: 13px;
        color: #fff;
    }

    .ask-input:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.1);
    }

    /* ── Copilot 霓虹弹窗 (Figma V2.2) ── */
    .copilot-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        z-index: 2000;
        /* Controlled by JS flex */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
    }

    .cp-takeover-title {
        font-family: var(--font-mono);
        color: #fff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 6px;
        text-transform: uppercase;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .cp-window {
        width: 900px;
        height: 340px;
        background: rgba(11, 17, 32, 0.85);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }

    .cp-window::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
        z-index: 10;
        background-size: 100% 3px;
        pointer-events: none;
        opacity: 0.3;
    }

    .cp-header {
        padding: 18px 24px;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid rgba(34, 211, 238, 0.2);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .cp-body {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .cp-term {
        flex: 1;
        overflow-y: auto;
        font-size: 14px;
        line-height: 1.6;
        padding-right: 20px;
    }

    .cp-term::-webkit-scrollbar {
        width: 6px;
    }

    .cp-term::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
    }

    .cp-log-item {
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
    }

    .cp-time {
        color: #888;
        flex-shrink: 0;
    }

    .cp-msg {
        word-break: break-all;
    }

    /* ── Typing Animation ── */
    .typing-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
    }

    .typing-dots span {
        width: 6px;
        height: 6px;
        background: var(--text-hint);
        border-radius: 50%;
        animation: dot-pulse 1.4s infinite;
        opacity: 0.4;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 1; }
    }
</style>

<!-- ── Ask 模式 侧边抽屉 (Figma V2.2) ── -->
<div class="ask-overlay" id="ask-overlay" onclick="if(event.target==this) closeAskMode()">
    <div class="ask-modal">
        <div class="ask-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:28px;height:28px;background:rgba(255,255,255,0.05);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--primary);">
                    <svg viewBox="0 0 1024 1024" width="16" height="16">
                        <path d="M240 658.08h220.784l55.744 65.04 55.744-65.04h220.768V272H240v386.08z m-48 32V240a16 16 0 0 1 16-16h617.04a16 16 0 0 1 16 16v450.08a16 16 0 0 1-16 16H594.336l-65.664 76.64a16 16 0 0 1-24.304 0l-65.664-76.64H208a16 16 0 0 1-16-16zM366.256 498.56a33.488 33.488 0 1 1 0-66.992 33.488 33.488 0 0 1 0 66.992z m150.272 0a33.488 33.488 0 1 1 0-66.992 33.488 33.488 0 0 1 0 66.992z m150.24 0a33.488 33.488 0 1 1 0-66.992 33.488 33.488 0 0 1 0 66.992z" fill="currentColor"></path>
                    </svg>
                </div>
                <div>
                    <div style="font-size:14px;font-weight:600;color:#fff;">Ask mode</div>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="modal-close-btn" style="border:none;background:none;color:rgba(255,255,255,0.4);cursor:pointer;" onclick="closeAskMode()">-</button>
            </div>
        </div>
        <div class="ask-body" id="ask-msg-container">
            <div class="msg msg-ai">你好！我是 CNC 智能助理。你可以问我关于设备状态、预警分析或生产建议的问题。</div>
        </div>
        <div class="ask-input-area">
            <input type="text" class="ask-input" id="ask-input" placeholder="询问当前设备状态或查询历史记录..." onkeydown="if(event.key==='Enter') sendAskMessage()">
            <div onclick="sendAskMessage()" style="cursor:pointer;color:var(--primary);padding:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </div>
        </div>
    </div>
</div>

<!-- ── Copilot 霓虹弹窗 (Figma V2.2 - Phase 3) ── -->
<div class="copilot-overlay" id="copilot-overlay">
    <div class="cp-takeover-title">• AI COPILOT TAKEOVER MODE •</div>
    <div class="cp-window">
        <div class="cp-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="display:flex;gap:6px;">
                    <span style="width:10px;height:10px;background:#ff5f56;border-radius:50%;"></span>
                    <span style="width:10px;height:10px;background:#ffbd2e;border-radius:50%;"></span>
                    <span style="width:10px;height:10px;background:#27c93f;border-radius:50%;"></span>
                </div>
                <div style="color:rgba(255, 255, 255, 0.5);font-size:11px;font-weight:700;letter-spacing:1px;font-family:var(--font-mono);">AI_COPILOT — SECURE TERMINAL</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;font-size:10px;color:#27c93f;font-weight:700;">

</div>
