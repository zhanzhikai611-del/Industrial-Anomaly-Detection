        <a href="/events/" hx-get="/events/" hx-target="#main-content" hx-push-url="true" hx-swap="innerHTML" hx-sync="this:replace" class="nav-link {% if request.resolver_match.url_name == 'event' %}active{% endif %}">

                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />

        <a href="/accounts/" hx-get="/accounts/" hx-target="#main-content" hx-push-url="true" hx-swap="innerHTML" hx-sync="this:replace" class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}">

                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            账号管理
        </a>

        <a href="/setting/" hx-get="/setting/" hx-target="#main-content" hx-push-url="true" hx-swap="innerHTML" hx-sync="this:replace" class="nav-link {% if request.resolver_match.url_name == 'setting' %}active{% endif %}">
            <svg viewBox="0 0 24 24">
