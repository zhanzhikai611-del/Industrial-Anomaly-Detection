<!-- 登录表单 -->
<form method="post" autocomplete="off">
    {% csrf_token %}

    {% if error %}
    <div class="error-msg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ error }}
    </div>
    {% endif %}

    <div class="fm-group">
        <label class="fm-label" for="id_username">用户名 / 工号</label>
        <div class="fm-wrap">
            <input class="fm-input {% if error %}error{% endif %}" type="text" id="id_username" name="username"
                placeholder="请输入用户名或工号" autofocus>
        </div>
    </div>

    <div class="fm-group">
        <label class="fm-label" for="id_password">密码</label>
        <div class="fm-wrap">
            <input class="fm-input {% if error %}error{% endif %}" type="password" id="id_password"
                name="password" placeholder="请输入密码">
            <span class="pw-toggle" id="pw-toggle" onclick="togglePassword()" title="显示/隐藏密码">
                <!-- Eye icon (visible state) -->
                <svg id="icon-eye" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <!-- Eye-off icon (hidden by default) -->
                <svg id="icon-eye-off" viewBox="0 0 24 24" style="display:none;">
                    <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
            </span>
        </div>
    </div>

    <button type="submit" class="login-btn">登 录</button>
</form>
