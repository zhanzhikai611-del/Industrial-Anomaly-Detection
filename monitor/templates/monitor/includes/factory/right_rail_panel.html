<!-- 右侧检视面板（日志与详情） -->
<div class="right-rail">
    <div class="rail-head" id="railLabel">Engine Log</div>
    <div class="rail-body">
        <!-- 全局日志列表 -->
        <div id="logList"></div>

        <!-- 设备检视器（默认隐藏，点击设备显示） -->
        <div id="inspectEl" class="inspector">
            <div class="ins-head">
                <span id="ins-name">--</span>
                <div class="ins-close" onclick="FactoryApp.ui.unfocus()">RETURN</div>
            </div>
            <div class="ins-row"><span>运行状态</span><span id="ins-stat" class="ins-val">--</span></div>
            <div class="ins-row"><span>表现度 [P]</span><span id="ins-oee" class="ins-val">--</span></div>
            <div class="ins-row"><span>主轴电流</span><span id="ins-cur" class="ins-val">--</span></div>
            <div class="ins-row"><span>主轴功率</span><span id="ins-pow" class="ins-val">--</span></div>
            
            <!-- 跨中心指令 (Maintenance Advice) -->
            <div style="margin-top: 24px;">
                <div class="st-title" style="margin-bottom:8px; color:var(--primary)">MAINTENANCE ADVICE</div>
                <div id="ins-advice" style="
                    background: var(--primary-bg);
                    border-left: 4px solid var(--primary);
                    padding: 10px;
                    font-size: 11px;
                    font-weight: 700;
                    color: var(--text);
                    line-height: 1.4;
                    border-radius: 4px;
                ">--</div>
            </div>

            <!-- 历史轨迹 (Historical Trace) -->
            <div style="margin-top: 24px;">
                <div class="st-title" style="margin-bottom:8px;">HISTORICAL TRACE (LATEST 20)</div>
                <div id="ins-history" style="font-family: var(--font-mono); font-size: 10px; max-height: 200px; overflow-y: auto;">
                    <!-- Items will be injected here -->
                </div>
            </div>
        </div>
    </div>
</div>
