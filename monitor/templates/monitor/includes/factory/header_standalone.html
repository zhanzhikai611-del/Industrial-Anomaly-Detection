<!-- 3D 页面专用全宽导航栏 -->
<header class="header">
    <a class="sidebar-brand" href="/dashboard/">
        <div class="logo-box">
            <svg viewBox="0 0 32 32" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11.5 8.71L16 11.31L20.5 8.71M11.5 24.29V19.1L7 16.5M25 16.5L20.5 19.1V24.29M7.27 11.46L16 16.51L24.73 11.46M16 26.58V16.5M25 20.5V12.5C24.9996 12.1493 24.9071 11.8048 24.7315 11.5012C24.556 11.1975 24.3037 10.9454 24 10.77L17 6.77C16.696 6.59446 16.3511 6.50205 16 6.50205C15.6489 6.50205 15.304 6.59446 15 6.77L8 10.77C7.69626 10.9454 7.44398 11.1975 7.26846 11.5012C7.09294 11.8048 7.00036 12.1493 7 12.5V20.5C7.00036 20.8507 7.09294 21.1952 7.26846 21.4988C7.44398 21.8025 7.69626 22.0546 8 22.23L15 26.23C15.304 26.4055 15.6489 26.498 16 26.498C16.3511 26.498 16.696 26.4055 17 26.23L24 22.23C24.3037 22.0546 24.556 21.8025 24.7315 21.4988C24.9071 21.1952 24.9996 20.8507 25 20.5Z" />
            </svg>
        </div>
        CNC Cloud
    </a>
    <div class="nav-center-tabs">
        <a href="/dashboard/" class="nav-center-tab">CNC Vision</a>
        <a href="/factory/" class="nav-center-tab active">Digital Twin</a>
    </div>
    <div class="header-right">
        <div style="position:relative;">
            <div class="avatar" id="user-avatar-btn" title="{{ user_display_name }}" onclick="FactoryApp.ui.toggleUserMenu()">
                {{ user_initial|default:"U" }}
            </div>
            <div id="user-dropdown" style="
                display: none;
                position: absolute;
                top: calc(100% + 10px);
                right: 0;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 4px 20px rgba(0,0,0,.12);
                border: 1px solid #e4e7ed;
                min-width: 180px;
                z-index: 999;
                overflow: hidden;
            ">
                <div style="padding:14px 16px 12px; border-bottom:1px solid #f0f2f5;">
                    <div style="font-size:14px;font-weight:600;color:#303133;">{{ user_display_name }}</div>
                    <div style="font-size:12px;color:#909399;margin-top:3px;">
                        {% if user_role == 'Admin' %}系统管理员
                        {% elif user_role == 'Engineer' %}工程师
                        {% else %}操作员{% endif %}
                    </div>
                </div>
                <a href="/logout/" style="
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 12px 16px;
                    font-size: 13px;
                    color: #606266;
                    text-decoration: none;
                    transition: background 0.15s;
                " onmouseover="this.style.background='#f5f7fa'" onmouseout="this.style.background=''">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    安全退出
                </a>
            </div>
        </div>
    </div>
</header>
