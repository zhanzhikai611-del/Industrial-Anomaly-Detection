<!-- 3D 渲染场景与 HUD 统计 -->
<div id="canvasArea">
    <div id="tooltip"></div>
    <div class="hud">
        <div class="stats-view">
            <div class="st-title">设备运行状态</div>
            <div class="st-row">
                <span><span class="st-dot" style="background:#67c23a"></span>运行</span>
                <span id="st-run">0</span>
            </div>
            <div class="st-row">
                <span><span class="st-dot" style="background:#E6A23C"></span>待机</span>
                <span id="st-std">0</span>
            </div>
            <div class="st-row">
                <span><span class="st-dot" style="background:#f56c6c"></span>停机</span>
                <span id="st-stop">0</span>
            </div>
        </div>
    </div>
</div>
