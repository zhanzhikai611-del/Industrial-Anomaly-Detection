{% for dev in devices %}
<tr style="cursor:pointer;" onclick="DeviceApp.modals.openAIModal({{ dev.device_id }})">
    <td style="font-weight:600;color:var(--text);">{{ dev.device_name }}</td>
    <td style="color:var(--text-hint);">{{ dev.device_type|default:"--" }}</td>
    <td style="color:var(--text-sec);font-size:12px;">{{ dev.machining_process|default:"--" }}</td>
    <td class="{{ dev.risk_cls }}" style="font-weight:700;">{{ dev.risk_pct }}</td>
    <td class="{{ dev.oee_cls }}" style="font-weight:700;">{{ dev.oee_pct }}</td>
    <td>
        <div class="status-container">
            <div class="status-pill {{ dev.status_cls }}" onclick="event.stopPropagation(); DeviceApp.engine.toggleStatusMenu(event, {{ dev.device_id }})">
                {{ dev.status_label }}
            </div>
            <div class="status-dropdown" id="status-menu-{{ dev.device_id }}">
                <div class="status-item {% if dev.current_status == 'Running' %}active{% endif %}" 
                     onclick="event.stopPropagation(); DeviceApp.engine.selectStatus({{ dev.device_id }}, 'Running')">
                    <span class="status-dot dot-running"></span>
                    Running
                </div>
                <div class="status-item {% if dev.current_status == 'Idle' %}active{% endif %}" 
                     onclick="event.stopPropagation(); DeviceApp.engine.selectStatus({{ dev.device_id }}, 'Idle')">
                    <span class="status-dot dot-idle"></span>
                    Standby
                </div>
                <div class="status-item {% if dev.current_status == 'Down' %}active{% endif %}" 
                     onclick="event.stopPropagation(); DeviceApp.engine.selectStatus({{ dev.device_id }}, 'Down')">
                    <span class="status-dot dot-down"></span>
                    Stopped
                </div>
            </div>
        </div>
    </td>
    <td>
        <button class="action-icon-btn"
            {% if dev.current_status != 'Down' %}disabled{% endif %}
            onclick="event.stopPropagation(); DeviceApp.modals.openRepairModal({{ dev.device_id }}, '{{ dev.device_name|escapejs }}')"
            title="下发维修工单（仅停机状态可操作）">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        </button>
    </td>
</tr>
{% empty %}
<tr><td colspan="7" style="text-align:center;padding:40px 0;color:var(--text-hint);">暂无匹配设备</td></tr>
{% endfor %}
