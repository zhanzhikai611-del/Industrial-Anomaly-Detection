<!-- 用户头像 + 下拉菜单 -->
<div style="position:relative;">
    <div class="avatar" id="user-avatar-btn" title="{{ user_display_name }}" onclick="toggleUserMenu()"
        style="cursor:pointer;">
        {{ user_initial }}
    </div>
    <!-- 下拉卡片 -->
    <div id="user-dropdown" style="
        display: none;
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,.12);
        border: 1px solid #e4e7ed;
        min-width: 180px;
        z-index: 999;
        overflow: hidden;
    ">
        <!-- 用户信息区 -->
        <div style="padding:14px 16px 12px; border-bottom:1px solid #f0f2f5;">
            <div style="font-size:14px;font-weight:600;color:#303133;">{{ user_display_name }}</div>
            <div style="font-size:12px;color:#909399;margin-top:3px;">
                {% if user_role == 'Admin' %}系统管理员
                {% elif user_role == 'Engineer' %}工程师
                {% else %}操作员{% endif %}
            </div>
        </div>
        <!-- 退出按钮 -->
        <a href="/logout/" style="
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #606266;
            text-decoration: none;
            transition: background 0.15s;
        " onmouseover="this.style.background='#f5f7fa'" onmouseout="this.style.background=''">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            安全退出
        </a>
    </div>
</div>
