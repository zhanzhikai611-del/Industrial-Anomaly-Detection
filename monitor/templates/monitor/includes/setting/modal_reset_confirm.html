<!-- 重置确认 Modal -->
<div class="modal-overlay" id="reset-modal">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">确定要重置分布吗？</div>
        <div class="modal-text">该操作将立即重置全量 25 台设备到初始的梯度风险分布。</div>
        <div class="modal-footer">
            <button class="modal-btn btn-cancel" onclick="SettingApp.ui.closeResetModal()">取消</button>
            <button class="modal-btn btn-confirm-red" id="btn-execute-reset" onclick="SettingApp.stream.confirmReset()">立即重置</button>
        </div>
    </div>
</div>
