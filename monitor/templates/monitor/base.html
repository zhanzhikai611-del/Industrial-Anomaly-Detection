<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>CNC Cloud | {% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* ══════════════════════════════════════
           Design Tokens  —  Figma V1.0.2
        ══════════════════════════════════════ */
        :root {
            --sidebar-w: 240px;
            --navbar-h: 56px;
            --bg: #f4f7fa;
            --card-bg: #ffffff;
            --card-shadow: 0 2px 12px 0 rgba(0, 0, 0, .05);
            --radius: 8px;
            --primary: #409EFF;
            --primary-bg: #ecf5ff;
            --ai-red: #ff6467;
            --danger: #f56c6c;
            --danger-deep: #f67575;
            --success: #67c23a;
            --warning: #E6A23C;
            --text: #303133;
            --text-sec: #606266;
            --text-hint: #909399;
            --text-weak: #C0C4CC;
            --border: #e4e7ed;
            --row-div: #f5f7fa;
            --font: -apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans SC', sans-serif;
            --font-mono: 'Menlo', 'Courier New', monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: var(--font);
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
        }

        /* ══════════════════════════════════════
           侧边栏  (Figma: w=240px, border-right #e4e7ed)
        ══════════════════════════════════════ */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            z-index: 200;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* Logo 区域与顶部 header 等高，在 header 内部的左侧品牌块 */
        .sidebar-brand {
            height: var(--navbar-h);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            flex-shrink: 0;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #fff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 导航列表 */
        .sidebar-nav {
            padding: 12px 0;
            flex: 1;
            overflow-y: auto;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            height: 37px;
            color: var(--text-sec);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: all .15s;
            font-size: 14px;
        }

        .nav-link svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-link:hover {
            background: #f5f7fa;
            color: var(--text);
        }

        .nav-link.active {
            background: var(--primary-bg);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        /* 底部版本号 */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-hint);
            flex-shrink: 0;
        }

        /* ══════════════════════════════════════
           顶部 Header  (固定, left=240px)
        ══════════════════════════════════════ */
        .header {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--navbar-h);
            z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 24px;
            gap: 14px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn {
            color: var(--text-hint);
            cursor: pointer;
            transition: color .15s;
            display: flex;
            align-items: center;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ══════════════════════════════════════
           主内容区
        ══════════════════════════════════════ */
        .main {
            margin-left: var(--sidebar-w);
            padding-top: var(--navbar-h);
            min-height: 100vh;
        }

        .content {
            padding: 24px;
        }

        /* ══════════════════════════════════════
           卡片
        ══════════════════════════════════════ */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 20px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 0;
        }

        /* Figma：3×14px 圆角蓝色色块 */
        .card-title-bar {
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--primary);
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .section-label {
            font-size: 12px;
            color: var(--text-hint);
            margin-bottom: 4px;
        }

        /* ══════════════════════════════════════
           Grid
        ══════════════════════════════════════ */
        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .col-3 {
            flex: 0 0 calc(25% - 12px);
        }

        .col-4 {
            flex: 0 0 calc(33.333% - 11px);
        }

        .col-5 {
            flex: 0 0 calc(41.667% - 10px);
        }

        .col-6 {
            flex: 0 0 calc(50% - 8px);
        }

        .col-7 {
            flex: 0 0 calc(58.333% - 9px);
        }

        .col-8 {
            flex: 0 0 calc(66.667% - 11px);
        }

        .col-9 {
            flex: 0 0 calc(75% - 12px);
        }

        .col-12 {
            flex: 0 0 100%;
        }

        .mb-4 {
            margin-bottom: 16px;
        }

        /* ══════════════════════════════════════
           通用表格
        ══════════════════════════════════════ */
        .tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .tbl th {
            background: #fafafa;
            color: var(--text-hint);
            font-weight: 500;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .tbl td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--row-div);
            color: var(--text);
        }

        .tbl tbody tr:hover {
            background: #f5f7ff;
        }

        .tbl tbody tr:last-child td {
            border-bottom: none;
        }

        /* ══════════════════════════════════════
           Modal
        ══════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            align-items: flex-start;
            justify-content: center;
            padding-top: 80px;
            background: rgba(0, 0, 0, .35);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0, 0, 0, .12);
            width: 860px;
            max-width: 95vw;
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .modal-close-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-hint);
            transition: all .15s;
            font-size: 15px;
        }

        .modal-close-btn:hover {
            background: var(--bg);
            color: var(--danger);
        }

        .modal-body {
            padding: 20px;
            display: flex;
            gap: 16px;
        }

        /* ══════════════════════════════════════
           按钮
        ══════════════════════════════════════ */
        .btn {
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid;
            transition: all .15s;
            font-family: var(--font);
        }

        .btn-primary {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: .85;
        }

        .btn-default {
            border-color: var(--border);
            background: #fff;
            color: var(--text-sec);
        }

        .btn-default:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 12px;
        }

        /* ══════════════════════════════════════
           风险色
        ══════════════════════════════════════ */
        .risk-high {
            color: var(--danger);
            font-weight: 600;
        }

        .risk-med {
            color: var(--warning);
            font-weight: 600;
        }

        .risk-low {
            color: var(--success);
            font-weight: 600;
        }

        /* ══════════════════════════════════════
           进度条
        ══════════════════════════════════════ */
        .progress-bar-wrap {
            height: 8px;
            background: #f0f2f5;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--primary);
            transition: width .5s;
        }

        /* ══════════════════════════════════════
           设备状态行
        ══════════════════════════════════════ */
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid var(--row-div);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            margin-right: 7px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            font-family: var(--font-mono);
        }

        /* ══════════════════════════════════════
           AI 诊断弹窗 特征快照卡
        ══════════════════════════════════════ */
        .snapshot-card {
            background: #f4f7fa;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }

        .snapshot-card .sk-label {
            font-size: 12px;
            color: var(--text-hint);
            margin-bottom: 6px;
        }

        .snapshot-card .sk-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            font-family: var(--font-mono);
        }

        .snapshot-card .sk-unit {
            font-size: 12px;
            color: var(--text-hint);
            margin-left: 4px;
        }

        /* ══════════════════════════════════════
           设备筛选卡 (Device 页)
        ══════════════════════════════════════ */
        .filter-cards-row {
            display: flex;
            gap: 14px;
        }

        .filter-card {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            background: #fff;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-card:hover {
            border-color: var(--primary);
        }

        .filter-card .fc-label {
            font-size: 14px;
            font-weight: 500;
        }

        .filter-card .fc-num {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .filter-card.all {
            border-color: #c0c4cc;
        }

        .filter-card.high {
            border-color: var(--danger);
        }

        .filter-card.high .fc-label,
        .filter-card.high .fc-num {
            color: var(--danger);
        }

        .filter-card.med {
            border-color: var(--warning);
        }

        .filter-card.med .fc-label,
        .filter-card.med .fc-num {
            color: var(--warning);
        }

        .filter-card.low {
            border-color: var(--success);
        }

        .filter-card.low .fc-label,
        .filter-card.low .fc-num {
            color: var(--success);
        }

        /* ══════════════════════════════════════
           分页
        ══════════════════════════════════════ */
        .pagination {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .page-btn {
            min-width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-sec);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            transition: all .15s;
        }

        .page-btn:hover,
        .page-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        /* ══════════════════════════════════════
           图表区段标题
        ══════════════════════════════════════ */
        .chart-section-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sec);
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0 0 8px;
        }

        .chart-section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 12px;
            background: var(--primary);
            border-radius: 2px;
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>

<body>

    <!-- ══════ 侧边栏 ══════ -->
    <aside class="sidebar">
        <a href="/dashboard/" class="sidebar-brand">
            <div class="logo-box">
                <!-- Codesandbox icon (Figma node 4:421) -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                    <line x1="12" y1="22.08" x2="12" y2="12" />
                </svg>
            </div>
            CNC Cloud
        </a>

        <nav class="sidebar-nav">
            <!-- 仪表盘 — grid icon -->
            <a href="/dashboard/" class="nav-link {% block nav_dashboard %}{% endblock %}">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                仪表盘
            </a>

            <!-- 设备监控 — cpu icon -->
            <a href="/devices/" class="nav-link {% block nav_device %}{% endblock %}">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <rect x="9" y="9" width="6" height="6" />
                    <line x1="9" y1="1" x2="9" y2="4" />
                    <line x1="15" y1="1" x2="15" y2="4" />
                    <line x1="9" y1="20" x2="9" y2="23" />
                    <line x1="15" y1="20" x2="15" y2="23" />
                    <line x1="20" y1="9" x2="23" y2="9" />
                    <line x1="20" y1="14" x2="23" y2="14" />
                    <line x1="1" y1="9" x2="4" y2="9" />
                    <line x1="1" y1="14" x2="4" y2="14" />
                </svg>
                设备监控
            </a>

            <!-- 事件中心 — file-minus icon -->
            <a href="/events/" class="nav-link {% block nav_event %}{% endblock %}">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="9" y1="15" x2="15" y2="15" />
                </svg>
                事件中心
            </a>

            <!-- 账号管理 — user icon -->
            <a href="/accounts/" class="nav-link {% block nav_account %}{% endblock %}">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                账号管理
            </a>

            <!-- 系统设置 — settings icon -->
            <a href="/setting/" class="nav-link {% block nav_setting %}{% endblock %}">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                系统设置
            </a>
        </nav>

        <div class="sidebar-footer">V1.0.2 · CNC预警系统</div>
    </aside>

    <!-- ══════ Header ══════ -->
    <header class="header">
        <div class="avatar" title="管理员">管</div>
        <span class="icon-btn" title="退出登录">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
        </span>
    </header>

    <!-- ══════ 主内容 ══════ -->
    <main class="main">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block extra_js %}{% endblock %}
</body>

</html>
